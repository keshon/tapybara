(() =&gt; {

  const seedLines = [
    {id:&#x27;a&#x27;,start:12,end:20,speaker:&#x27;Innokentiy&#x27;,text:&#x27;Давайте сначала посмотрим, что осталось до релиза.&#x27;,human:false,issue:&#x27;&#x27;},

    const button=(action,label,cls=&#x27;&#x27;,extra=&#x27;&#x27;)=&gt;`&lt;button type=&quot;button&quot; class=&quot;cursor-interaction ${cls}&quot; data-action=&quot;${action}&quot; ${extra}&gt;${label}&lt;/button&gt;`;

    function transact(label,change){const d=doc();d.undo.push({label,title:d.title,lines:clone(d.lines),note:d.note,dictionary:clone(d.dictionary)});d.redo=[];change(d);state.message=label+&#x27; · saved&#x27;;state.menu=null;state.dialog=null;state.selection=null;render();remember();}
    function undo(redo=false){const d=doc(),from=redo?d.redo:d.undo,to=redo?d.undo:d.redo;if(!from.length)return;const prior=from.pop();to.push({label:prior.label,title:d.title,lines:clone(d.lines),note:d.note,dictionary:clone(d.dictionary)});d.title=prior.title;d.lines=prior.lines;d.note=prior.note;d.dictionary=prior.dictionary;state.selection=null;state.message=(redo?&#x27;Redid: &#x27;:&#x27;Undid: &#x27;)+prior.label;render();remember();}
    function selectInterruption(){const target=doc().lines.find(l=&gt;l.issue===&#x27;mixed&#x27;);if(!target)return;const at=target.text.indexOf(&#x27;Подожди&#x27;);state.selection={id:target.id,start:Math.max(at,0),length:at&lt;0?target.text.length:target.text.length-at};state.inspector=true;state.panel=&#x27;review&#x27;;state.position=24;state.tab=&#x27;transcript&#x27;;state.message=&#x27;Selected disputed phrase · 00:24–00:31&#x27;;render();}

s[c.id].lines.some(l=&gt;l.issue)?&#x27;&lt;span class=&quot;tp-tag&quot;&gt;Needs review&lt;/span&gt;&#x27;:&#x27;&#x27;}`,&#x27;tp-call-open&#x27;,`data-call=&quot;${c.id}&quot;`)}${button(&#x27;call-menu&#x27;,&#x27;⋯&#x27;,&#x27;tp-menu-trigger&#x27;,`data-call=&quot;${c.id}&quot; aria-label=&quot;Actions for ${esc(docTitle(c.id))}&quot;`)}&lt;/div&gt;`).join(&#x27;&#x27;):&#x27;&lt;p class=&quot;tp-empty&quot;&gt;No matching calls. Change or clear the filters.&lt;/p&gt;&#x27;}&lt;p class=&quot;tp-muted&quot; style=&quot;font-size:12px;margin:20px 4px 0&quot;&gt;${filtered.length} calls · stored on this device&lt;/p&gt;`;

    function docTitle(id){return state.docs[id].title;}
    function renderLines(){return doc().lines.map(l=&gt;{
