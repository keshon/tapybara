    function updateExport(){const preview=app.querySelector('[data-export-preview]');if(preview){const text=exportText();preview.textContent=text.length>780?text.slice(0,780)+'…':text;const dest=app.querySelector('[data-dialog-field=destination]').value;app.querySelector('[data-action=prepare-export]').textContent=dest==='copy'?'Copy preview':'Save preview';}}
    function render(){
      app.classList.toggle('has-inspector',state.inspector);app.classList.toggle('library-open',state.library);
      app.style.setProperty('--tp-line-height',choices.spacing);
      const d=doc();
      app.innerHTML=`<div class="tp-chrome"><span class="tp-mark" aria-hidden="true"></span><span>Tapybara</span><small>UI prototype · sample call</small></div><div class="tp-shell"><nav class="tp-rail" aria-label="App navigation">${button('nav-dictations',icon('mic')+'<span>Dictation</span>')}${button('nav-calls',icon('phone')+'<span>Calls</span>','is-active')}${button('nav-dictionary',icon('book-open')+'<span>Dictionary</span>')}<span class="tp-spacer"></span>${button('nav-settings',icon('settings')+'<span>Settings</span>')}</nav><aside class="tp-library">${renderLibrary()}</aside><main class="tp-main"><header class="tp-heading"><div class="tp-flex">${button('library',icon('panel-left'),'tp-mobile-library tp-icon','aria-label="Show call library"')}<h2>${esc(d.title)}</h2></div><p class="tp-heading-meta">8 October 2026 · ${stamp(call().duration)} · ${call().people.join(', ')}, you</p><div class="tp-flex tp-actions">${button('play',icon(state.playing?'pause':'play')+(state.playing?' Pause':' Play'))}${button('undo',icon('undo-2'),'tp-icon',`aria-label="Undo" data-tooltip="${esc(d.undo.length?'Undo '+d.undo.at(-1).label:'Undo')}" ${d.undo.length?'':'disabled'}`)}${button('redo',icon('redo-2'),'tp-icon','aria-label="Redo" '+(d.redo.length?'':'disabled'))}<span class="tp-spacer"></span>${button('export',icon('download')+' Export ▾')}${button('inspector',icon('panel-right')+' Review','',`aria-pressed="${state.inspector}"`)}${button('header-menu','⋯','tp-icon','aria-label="More call actions"')}</div></header><div class="tp-tabs">${button('transcript','Transcript',state.tab==='transcript'?'is-active':'')}${button('notes','Notes',state.tab==='notes'?'is-active':'')}</div>${state.tab==='notes'?`<textarea class="tp-note" data-field="note" aria-label="Call notes">${esc(d.note)}</textarea>${button('save-note','Save note')}`:`<div class="tp-editor-layout"><section class="tp-transcript">${doc().lines.some(l=>l.issue==='mixed')?`<div class="tp-review-banner"><span>Speaker change to review at 00:24</span>${button('review-mixed','Review phrase')}</div>`:''}<div data-editbar>${editbar()}</div>${renderLines()}</section>${inspector()}</div>`}<div class="tp-audio-dock">${waveform()}<div class="tp-transport">${button('rewind',icon('rotate-ccw')+' 3s')}${button('play',icon(state.playing?'pause':'play'),'tp-icon',`aria-label="${state.playing?'Pause':'Play'} preview playback"`)}<small>${stamp(state.position)} / ${stamp(call().duration)}</small>${button('play-selection',icon('audio-lines')+' Selection','',state.selection?'':'disabled')}${button('wave','Waveform','',`aria-pressed="${state.wave}"`)}<label class="tp-follow"><input type="checkbox" data-field="follow" ${state.follow?'checked':''}>Follow</label><div class="tp-seek"><input type="range" data-field="seek" min="0" max="${call().duration}" value="${state.position}" step=".1" aria-label="Playback position"></div></div></div></main></div><div class="tp-status"><span aria-live="polite">${esc(state.message)}</span><span>Sample waveform · playback simulated</span></div>${menu()}${dialog()}`;
      app.querySelectorAll('.tp-rail button').forEach(btn=>btn.setAttribute('aria-label',btn.textContent.trim()));
      if(state.tab==='transcript'){const add=document.createElement('button');add.type='button';add.className='cursor-interaction tp-quiet';add.dataset.action='add-segment';add.textContent='+ Add missing speech';app.querySelector('.tp-transcript').appendChild(add);}
      if(Object.keys(state.deleted).length){const restore=document.createElement('button');restore.type='button';restore.className='cursor-interaction tp-quiet';restore.dataset.action='restore-call';restore.textContent='Restore deleted call';app.querySelector('.tp-library').appendChild(restore);}
      if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});updateExport();
    }
    function openMenu(kind,event,id){const rect=app.getBoundingClientRect();state.menu={kind,x:Math.max(10,Math.min(event.clientX-rect.left,rect.width-230)),y:Math.max(50,event.clientY-rect.top+8)};if(id&&kind==='call'){state.call=id;state.selection=null;}render();}
    app.addEventListener('click',event=>{
      const target=event.target.closest('[data-action]');
      if(!target){const wave=event.target.closest('[data-wave]');if(wave){const r=wave.getBoundingClientRect();state.position=18+(event.clientX-r.left)/r.width*state.zoom;state.message='Seek to '+stamp(state.position);render();remember();}else if(state.menu&&!event.target.closest('.tp-floating')){state.menu=null;render();}return;}
      const action=target.dataset.action;
      if(action==='open-call'){state.call=target.dataset.call;state.selection=null;state.menu=null;state.position=24;state.message='All changes saved locally';render();remember();return;}
      if(action==='call-menu'){openMenu('call',event,target.dataset.call);return;}
      if(action==='header-menu'){openMenu('header',event);return;}
      if(action==='line-menu'||action==='selection-more'){if(target.dataset.line&&state.selection?.id!==target.dataset.line){const l=doc().lines.find(l=>l.id===target.dataset.line);state.selection={id:l.id,start:0,length:l.text.length};}openMenu('line',event);return;}
      if(action==='review-mixed'){selectInterruption();return;}
      if(action==='review-word'){const l=doc().lines.find(l=>l.issue==='word');if(l){const at=l.text.indexOf('Регстат');state.selection={id:l.id,start:at,length:7};showDialog('edit');}return;}
      if(action==='speaker'){const l=doc().lines.find(l=>l.id===target.dataset.line);state.selection={id:l.id,start:0,length:l.text.length};showDialog('assign');return;}
      if(action==='split'){splitAtCaret();return;}
      if(action==='edit'||action==='assign'){selectedForAction();showDialog(action);return;}
      if(action==='timing'){const l=doc().lines.find(l=>l.id===target.dataset.line);state.selection={id:l.id,start:0,length:l.text.length};showDialog('timing');return;}
      if(action==='apply-timing'){const start=Number(app.querySelector('[data-dialog-field=timing-start]').value),end=Number(app.querySelector('[data-dialog-field=timing-end]').value),overlap=app.querySelector('[data-dialog-field=timing-overlap]').checked;if(start<0||end<=start||end>call().duration){app.querySelector('.tp-status span').textContent='Choose a valid time range';return;}const id=state.selection.id;transact('Adjust segment timing',d=>{const l=d.lines.find(l=>l.id===id);l.start=start;l.end=end;l.overlap=overlap;l.approximate=false;});return;}
      if(action==='filters'){state.filtersOpen=!state.filtersOpen;render();return;}
      if(action==='remove-filter'){state[target.dataset.filter]='';render();return;}
      if(action==='wave-sources'||action==='wave-speakers'){state.waveMode=action==='wave-sources'?'sources':'speakers';render();remember();return;}
      if(action==='timeline-segment'){const l=doc().lines.find(l=>l.id===target.dataset.line);state.selection={id:l.id,start:0,length:l.text.length};state.position=l.start;state.rangeEnd=l.end;state.playing=true;state.message='Preview interval · original source audio, including other voices';render();return;}
      if(action==='delete-text'){selectedForAction();const sel=clone(state.selection);transact('Delete selection',d=>{const l=d.lines.find(l=>l.id===sel.id);const text=l.text.slice(0,sel.start)+l.text.slice(sel.start+sel.length);if(!text.trim())d.lines=d.lines.filter(x=>x.id!==l.id);else{l.text=text.trim();l.human=true;}});return;}
      if(action==='merge'){selectedForAction();transact('Merge segments',d=>{const at=d.lines.findIndex(l=>l.id===state.selection.id);if(at>=0&&at<d.lines.length-1){d.lines[at].text+=' '+d.lines[at+1].text;d.lines[at].end=d.lines[at+1].end;d.lines[at].human=true;d.lines.splice(at+1,1);}});return;}
      if(action==='apply-edit'){const replacement=app.querySelector('[data-dialog-field=replacement]').value;const all=app.querySelector('[data-dialog-field=all]').checked,dict=app.querySelector('[data-dialog-field=dictionary]').checked,sel=clone(state.selection),before=selectedText();transact('Correct selected text',d=>{if(all&&before)d.lines.forEach(l=>{if(l.text.includes(before)){l.text=l.text.replaceAll(before,replacement);l.human=true;}});else{const l=d.lines.find(l=>l.id===sel.id);l.text=l.text.slice(0,sel.start)+replacement+l.text.slice(sel.start+sel.length);l.human=true;l.issue='';l.approximate=true;}if(dict&&before)d.dictionary[before]=replacement;});return;}
      if(action==='apply-split'){
        const selected=line(),sel=clone(state.selection),kind=state.dialog.kind,partialAssignment=sel.start>0||sel.length<selected.text.length;
        const boundaryField=app.querySelector('[data-dialog-field=boundary]'),endField=app.querySelector('[data-dialog-field=end-boundary]');
        const boundary=boundaryField?Number(boundaryField.value):selected.start,end=endField?Number(endField.value):selected.end;
        const overlap=app.querySelector('[data-dialog-field=overlap]')?.checked;
        let speaker=app.querySelector('[data-dialog-field=speaker]').value;if(speaker==='new')speaker=app.querySelector('[data-dialog-field=new-name]').value.trim();
        const splitText=app.querySelector('[data-dialog-field=split-text]')?.value;
        if(!speaker||boundary<selected.start||end>selected.end||end<=boundary||splitText!==undefined&&(!selected.text.startsWith(splitText)||!splitText.trim()||splitText.length>=selected.text.length)){app.querySelector('.tp-status span').textContent='Choose a valid name, text boundary and audio range';return;}
        if(!people.includes(speaker))people.push(speaker);
        transact(kind==='assign'&&!boundaryField?'Assign speaker':'Split & assign speaker',d=>{
          const at=d.lines.findIndex(l=>l.id===selected.id),uid='split-'+Date.now(),pieces=[];
          const head=splitText!==undefined?splitText:selected.text.slice(0,sel.start);
          const middle=splitText!==undefined?selected.text.slice(splitText.length):selected.text.slice(sel.start,sel.start+sel.length);
          const tail=splitText!==undefined?'':selected.text.slice(sel.start+sel.length);
          if(head.trim())pieces.push({...selected,text:head.trim(),end:overlap?Math.min(end,boundary+.7):boundary,human:true,issue:'',approximate:true});
          pieces.push({...selected,id:head.trim()?uid:selected.id,start:head.trim()?boundary:selected.start,end:tail.trim()?end:selected.end,text:middle.trim(),speaker,human:true,issue:'',approximate:partialAssignment||selected.approximate,overlap:!!overlap});
          if(tail.trim())pieces.push({...selected,id:uid+'-tail',start:end,text:tail.trim(),human:true,issue:'',approximate:true});
          d.lines.splice(at,1,...pieces);
        });return;
      }
      if(action==='undo'){undo();return;}if(action==='redo'){undo(true);return;}
      if(action==='clear-selection'){state.selection=null;render();return;}
      if(action==='seek-line'){const l=doc().lines.find(l=>l.id===target.dataset.line);state.position=l.start;state.message='Playhead at '+stamp(l.start);render();remember();return;}
      if(action==='play'||action==='play-selection'||action==='play-issue'||action==='preview-boundary'){
        if(action==='play-issue'){state.position=24;state.rangeEnd=31;state.playing=true;state.message='Preview: disputed exchange · 00:24–00:31';}
        else if(action==='play-selection'){state.position=line()?.start||24;state.rangeEnd=line()?.end||31;state.playing=true;state.message='Preview: selected segment · '+stamp(state.position)+'–'+stamp(state.rangeEnd);}
        else if(action==='preview-boundary'){state.message='Preview boundary at '+app.querySelector('[data-dialog-field=boundary]').value+' seconds';app.querySelector('.tp-status span').textContent=state.message;return;}
        else{state.rangeEnd=null;state.playing=!state.playing;state.message=state.playing?'Preview playback · no audio':'Paused at '+stamp(state.position);}
        render();return;
      }
      if(action==='rewind'){state.position=Math.max(0,state.position-3);render();return;}
      if(action==='wave'){state.wave=!state.wave;render();remember();return;}
      if(action==='inspector'){state.inspector=!state.inspector;render();remember();return;}
      if(action==='panel-review'||action==='panel-people'){state.panel=action==='panel-review'?'review':'people';render();remember();return;}
      if(action==='transcript'||action==='notes'){state.tab=action;render();return;}
      if(action==='save-note'){const value=app.querySelector('[data-field=note]').value;transact('Edit note',d=>{d.note=value;});return;}
      if(action==='export'||action==='rename'||action==='retranscribe'||action==='recompute'){showDialog(action);return;}
      if(action==='delete-call'){showDialog('delete');return;}
      if(action==='add-person'){showDialog('person');return;}
      if(action==='add-segment'){showDialog('add-segment');return;}
      if(action==='apply-add-segment'){const text=app.querySelector('[data-dialog-field=new-text]').value.trim(),start=Number(app.querySelector('[data-dialog-field=new-start]').value),end=Number(app.querySelector('[data-dialog-field=new-end]').value),speaker=app.querySelector('[data-dialog-field=speaker]').value;if(!text||start<0||end<=start||end>call().duration){app.querySelector('.tp-status span').textContent='Enter text and a valid audio range';return;}transact('Add missing speech',d=>{d.lines.push({id:'new-'+Date.now(),start,end,speaker,text,human:true,issue:''});d.lines.sort((a,b)=>a.start-b.start);});return;}
      if(action==='apply-person'){const p=app.querySelector('[data-dialog-field=name]').value.trim();if(p&&!people.includes(p))people.push(p);state.dialog=null;state.panel='people';render();return;}
      if(action==='apply-rename'){const name=app.querySelector('[data-dialog-field=name]').value.trim();if(name)transact('Rename call',d=>d.title=name);return;}
      if(action==='apply-delete-call'){if(Object.keys(state.docs).length<=1){app.querySelector('.tp-status span').textContent='Keep one sample call available in this prototype';return;}const deleted=state.call;state.deleted[deleted]=state.docs[deleted];delete state.docs[deleted];state.call=Object.keys(state.docs)[0];state.dialog=null;state.message='Call moved to Deleted calls · Restore available in call library';render();return;}
      if(action==='restore-call'){const id=Object.keys(state.deleted).at(-1);if(id){state.docs[id]=state.deleted[id];delete state.deleted[id];state.message='Call restored';render();}return;}
      if(action==='prepare-export'){const dest=app.querySelector('[data-dialog-field=destination]').value,fmt=app.querySelector('[data-dialog-field=format]').value;state.dialog=null;state.message=dest==='copy'?'Clipboard copy preview prepared':'File preview prepared · '+doc().title+'.'+fmt;render();return;}
      if(action==='start-retranscribe'||action==='start-recompute'){state.dialog=null;state.message=action==='start-retranscribe'?'New revision requested · existing edits preserved':'Speaker analysis requested · human assignments locked';render();return;}
      if(action==='cancel-dialog'){state.dialog=null;render();return;}

      if(action==='library'){state.library=!state.library;render();return;}
      if(action==='zoom-in'||action==='zoom-out'){state.zoom=Math.max(15,Math.min(120,state.zoom*(action==='zoom-in'?.5:2)));render();return;}
      if(action==='turn-pavel'||action==='turn-anna'){state.position=action==='turn-pavel'?24:32;render();return;}
      if(action==='record'){state.recording=!state.recording;state.message=state.recording?'Recording state preview · microphone not active':'Recording stopped · prototype';render();return;}

    });
    app.addEventListener('change',event=>{
      const t=event.target;if(t.dataset.field==='person'||t.dataset.field==='status'||t.dataset.field==='date'){state[t.dataset.field]=t.value;render();return;}
      if(t.dataset.field==='follow'){state.follow=t.checked;return;}
      if(t.dataset.dialogField==='speaker'){app.querySelector('[data-dialog-field=new-name]').hidden=t.value!=='new';}
      if(t.dataset.dialogField)updateExport();
    });
    app.addEventListener('input',event=>{const t=event.target;if(t.dataset.field==='search'){state.query=t.value;const start=t.selectionStart;render();const input=app.querySelector('[data-field=search]');input.focus();input.setSelectionRange(start,start);}if(t.dataset.field==='seek'){state.position=Number(t.value);state.message='Seek to '+stamp(state.position);const values=app.querySelectorAll('.tp-transport small');values.forEach(v=>v.textContent=stamp(state.position)+' / '+stamp(call().duration));}if(t.dataset.dialogField)updateExport();});
    let editingSession=null;
    app.addEventListener('focusin',event=>{const p=event.target.closest('[data-text]');if(p)editingSession={id:p.dataset.text,before:clone(doc()),changed:false};});
    app.addEventListener('input',event=>{const p=event.target.closest('[data-text]');if(!p)return;const l=doc().lines.find(l=>l.id===p.dataset.text);if(!editingSession||editingSession.id!==l.id)editingSession={id:l.id,before:clone(doc()),changed:false};if(!editingSession.changed){const d=editingSession.before;doc().undo.push({label:'Edit segment text',title:d.title,lines:d.lines,note:d.note,dictionary:d.dictionary});doc().redo=[];editingSession.changed=true;}l.text=p.textContent;l.human=true;state.message='Text edited · timing needs review';l.approximate=true;captureCaret(p);app.querySelector('[data-action=undo]').disabled=false;app.querySelector('[data-action=redo]').disabled=true;app.querySelector('.tp-status [aria-live]').textContent=state.message;remember();});
    app.addEventListener('mouseup',event=>{const p=event.target.closest('[data-text]');if(p&&event.button===0)captureCaret(p);});
    app.addEventListener('keyup',event=>{const p=event.target.closest('[data-text]');if(p)captureCaret(p);});
    app.addEventListener('contextmenu',event=>{const row=event.target.closest('[data-line]'),callRow=event.target.closest('.tp-call');if(row){event.preventDefault();const l=doc().lines.find(l=>l.id===row.dataset.line);if(state.selection?.id!==l.id)state.selection={id:l.id,start:0,length:l.text.length};openMenu('line',event);}else if(callRow){event.preventDefault();openMenu('call',event,callRow.querySelector('[data-call]').dataset.call);}});
    app.addEventListener('keydown',event=>{if(event.ctrlKey&&event.key==='Enter'&&event.target.closest('[data-text]')){event.preventDefault();captureCaret(event.target.closest('[data-text]'));splitAtCaret();return;}if(event.key==='Enter'&&event.target.closest('[data-text]')){event.preventDefault();state.message='Use Ctrl+Enter to split between words';return;}if(event.key==='Escape'){state.dialog=null;state.menu=null;render();}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'&&!event.target.matches('input,textarea')){event.preventDefault();undo(event.shiftKey);}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='y'&&!event.target.matches('input,textarea')){event.preventDefault();undo(true);}if(event.key==='Enter'&&state.dialog?.kind==='edit'&&!event.shiftKey){event.preventDefault();app.querySelector('[data-action=apply-edit]').click();}});
    setInterval(()=>{if(!state.playing||app.closest('[data-variant]').hidden||state.dialog||state.menu)return;const end=state.rangeEnd??call().duration;state.position=Math.min(end,state.position+.25);if(state.position>=end){state.playing=false;state.message='Paused at '+stamp(state.position);render();return;}app.querySelectorAll('.tp-transport small').forEach(v=>v.textContent=stamp(state.position)+' / '+stamp(call().duration));const seek=app.querySelector('[data-field=seek]');if(seek)seek.value=state.position;app.querySelectorAll('.tp-line').forEach(el=>{const l=doc().lines.find(l=>l.id===el.dataset.line);el.classList.toggle('is-playing',state.position>=l.start&&state.position<l.end);});app.querySelectorAll('.tp-playhead').forEach(el=>el.style.left=Math.max(0,Math.min(100,(state.position-18)/state.zoom*100))+'%');},250);
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:render});tweak.addSlider(choices,'spacing',{label:'Transcript line spacing',min:1.4,max:2,step:.05,reference:'transcript.lineSpacing'});tweak.addToggle(state,'inspector',{label:'Inspector open'});tweak.addToggle(state,'wave',{label:'Waveform expanded'});}
  });

})();
