name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменяем предыдущий прогон той же ветки: смысла собирать позапрошлый
# коммит, пока правится текущий, нет.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    # WPF, WASAPI и Win32-интероп существуют только на Windows — собрать это
    # на ubuntu-latest невозможно в принципе, а не «неудобно».
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Кэш NuGet: восстановление тянет нативные библиотеки whisper.cpp,
      # а это сотня мегабайт на каждый прогон.
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Скрипт сборки с BOM «работает», но печатает в консоль каждую свою
      # строку: cmd читает три байта BOM как часть первой команды, и
      # «@echo off» не срабатывает. Редактор добавляет BOM молча, поэтому
      # ловим его здесь, а не глазами.
      - name: Check that scripts have no BOM
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -File -Include *.cmd, *.bat | Where-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
          }
          if ($bad) { $bad | ForEach-Object { "BOM in $($_.FullName)" }; exit 1 }

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors включён в Directory.Build.props, поэтому сборка
      # и есть проверка стиля: отдельного шага для анализаторов не нужно.
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test tests/Tapybara.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  package:
    name: Package
    needs: build
    runs-on: windows-latest

    # Право на запись нужно только шагу создания релиза. По умолчанию у токена
    # его нет, и job молча падал бы на последнем шаге — уже после того, как
    # собрал и заархивировал всё, что нужно.
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 — чтобы был сам объект тега: текст релиза берётся из
      # его тела, а при поверхностном клоне его просто нет.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Версия из тега, если собираем тег. Иначе остаётся та, что в
      # Directory.Build.props: сборка из ветки не должна притворяться релизом.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $version = $ref -replace "^refs/tags/v", ""
          } else {
            $version = ""
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "isRelease=$([string]::IsNullOrEmpty($version) -eq $false)" >> $env:GITHUB_OUTPUT

      # Прошлый релиз нужен vpk, чтобы собрать дельту: обновление с него на
      # новый весит мегабайты, а не сотню. У первого релиза прошлого нет —
      # поэтому шаг не обязан пройти.
      - name: Fetch the previous release for delta updates
        if: steps.version.outputs.isRelease == 'True'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir Releases

      # Сборка и упаковка — тем же build.cmd, что и на машине разработчика:
      # релиз не должен собираться иначе, чем его проверяли локально. Там же
      # объяснено, почему папка, а не один файл, и почему без CUDA.
      # Без версии (сборка из ветки) build.cmd берёт её из Directory.Build.props.
      - name: Publish and pack
        shell: cmd
        run: build.cmd installer ${{ steps.version.outputs.version }}

      - name: Zip
        shell: pwsh
        run: |
          $suffix = "${{ steps.version.outputs.version }}"
          if ($suffix -eq "") { $suffix = "${{ github.sha }}".Substring(0, 7) }
          Compress-Archive -Path dist\* -DestinationPath "Tapybara-$suffix-win-x64.zip"
          "ZIP_NAME=Tapybara-$suffix-win-x64.zip" >> $env:GITHUB_ENV

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Tapybara-win-x64
          path: |
            ${{ env.ZIP_NAME }}
            Releases/Tapybara-win-Setup.exe
          retention-days: 30

      # Текст релиза — из тела аннотированного тега. Это единственное место,
      # где его пишет человек: список коммитов, сгенерированный GitHub, отвечает
      # на вопрос «что делали», а читателю релиза нужен ответ на «что мне это
      # даёт». Если тег лёгкий, генерация остаётся как запасной вариант.
      - name: Read release notes from the tag
        if: steps.version.outputs.isRelease == 'True'
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $body = (git tag -l --format='%(contents:body)' $tag | Out-String).Trim()
          $hasBody = -not [string]::IsNullOrWhiteSpace($body)

          # Массив строк, а не here-string: содержимое here-string в PowerShell
          # обязано начинаться с нулевой колонки, а YAML на нулевой колонке
          # считает строку концом блока. Разделитель "---" внутри такого блока
          # ломает весь файл, причём молча — парсер видит второй документ.
          $install = @(
            '---'
            ''
            'Windows x64 - .NET is not required on the target machine.'
            ''
            '**Install:** run `Tapybara-win-Setup.exe`. It installs for your user, without'
            'administrator rights, and keeps itself up to date: new versions download in the'
            'background and install the next time Tapybara starts.'
            ''
            '**Portable:** unzip `Tapybara-*-win-x64.zip` anywhere and run `Tapybara.exe`. Put an'
            'empty file named `portable.txt` next to it and settings and models live in a `Data`'
            'folder beside it. The zip does not update itself.'
            ''
            'On first launch a short window walks you through downloading a recognition model,'
            'checking the microphone and dictating a first sentence.'
          ) -join "`n"

          if ($hasBody) { $full = $body + "`n`n" + $install } else { $full = $install }

          "hasBody=$hasBody" >> $env:GITHUB_OUTPUT
          "body<<TAPYBARA_NOTES" >> $env:GITHUB_OUTPUT
          $full >> $env:GITHUB_OUTPUT
          "TAPYBARA_NOTES" >> $env:GITHUB_OUTPUT

      # Релиз создаётся только по тегу вида v1.2.3. Модели в поставку не
      # входят — приложение скачивает их само из «Настройки › Модели».
      - name: Release
        if: steps.version.outputs.isRelease == 'True'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.hasBody != 'True' }}

      # Установщик и пакеты обновлений — в тот же релиз (--merge), а не в
      # отдельный: установленные копии ищут обновления именно в последнем
      # релизе, по файлу releases.win.json, который vpk кладёт рядом.
      - name: Upload installer and update packages
        if: steps.version.outputs.isRelease == 'True'
        shell: pwsh
        run: |
          dotnet vpk upload github --outputDir Releases --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --merge --publish --tag ${{ github.ref_name }}
