name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменяем предыдущий прогон той же ветки: смысла собирать позапрошлый
# коммит, пока правится текущий, нет.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    # WPF, WASAPI и Win32-интероп существуют только на Windows — собрать это
    # на ubuntu-latest невозможно в принципе, а не «неудобно».
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Кэш NuGet: восстановление тянет нативные библиотеки whisper.cpp,
      # а это сотня мегабайт на каждый прогон.
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors включён в Directory.Build.props, поэтому сборка
      # и есть проверка стиля: отдельного шага для анализаторов не нужно.
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test tests/Tapybara.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  package:
    name: Package
    needs: build
    runs-on: windows-latest

    # Право на запись нужно только шагу создания релиза. По умолчанию у токена
    # его нет, и job молча падал бы на последнем шаге — уже после того, как
    # собрал и заархивировал всё, что нужно.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Версия из тега, если собираем тег. Иначе остаётся та, что в
      # Directory.Build.props: сборка из ветки не должна притворяться релизом.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $version = $ref -replace "^refs/tags/v", ""
          } else {
            $version = ""
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "isRelease=$([string]::IsNullOrEmpty($version) -eq $false)" >> $env:GITHUB_OUTPUT

      # Самодостаточная сборка: на машине пользователя .NET не нужен.
      # Не PublishSingleFile — нативные библиотеки whisper.cpp лежат в
      # подпапках runtimes\ и грузятся по пути во время работы, поэтому
      # рабочая форма поставки — папка.
      #
      # CUDA не включаем. Она весит 150 МБ и требует cublas из CUDA Toolkit,
      # которого на обычной машине нет: почти для всех это 150 МБ, которые
      # загружаются, не находят зависимость и уступают Vulkan.
      - name: Publish
        shell: pwsh
        run: |
          # Не $args: это автоматическая переменная PowerShell, и присваивание
          # ей внутри скрипта работает, но читается как ошибка.
          $publishArgs = @('publish', 'src/Tapybara.App', '-c', 'Release', '-r', 'win-x64',
                           '--self-contained', 'true', '-o', 'dist')
          if ("${{ steps.version.outputs.version }}" -ne "") {
            $publishArgs += "-p:Version=${{ steps.version.outputs.version }}"
          }
          dotnet @publishArgs

      - name: Zip
        shell: pwsh
        run: |
          $suffix = "${{ steps.version.outputs.version }}"
          if ($suffix -eq "") { $suffix = "${{ github.sha }}".Substring(0, 7) }
          Compress-Archive -Path dist\* -DestinationPath "Tapybara-$suffix-win-x64.zip"
          "ZIP_NAME=Tapybara-$suffix-win-x64.zip" >> $env:GITHUB_ENV

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Tapybara-win-x64
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      # Релиз создаётся только по тегу вида v1.2.3. Модели в поставку не
      # входят — приложение скачивает их само из «Настройки › Модели».
      - name: Release
        if: steps.version.outputs.isRelease == 'True'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          body: |
            Self-contained build for Windows x64 — .NET is not required on the target machine.

            Unzip anywhere and run `Tapybara.exe`. On first launch, open
            **Settings › Models** and download a recognition model; nothing works
            until you do.

            For a portable install, put an empty file named `portable.txt` next to
            the executable — settings and models then live in a `Data` folder
            beside it instead of in `%APPDATA%`.
